
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DiskSim | Benchmark</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-2">DiskSim</h1>
    <p class="text-center text-muted mb-5">
        Disk Scheduling Algorithm Benchmark Simulator
    </p>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <h4 class="mb-4">Configure Workload</h4>

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Scheduling Mode</label>
                    <select id="mode" class="form-select">
                        <option value="batch">Batch Scheduling</option>
                        <option value="dynamic">Dynamic Scheduling</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Number of Cylinders</label>
                    <input type="number" id="cylinders"
                           class="form-control" value="200" min="2">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Number of Requests</label>
                    <input type="number" id="numRequests"
                           class="form-control" value="100" min="1">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Initial Head Position</label>
                    <input type="number" id="head"
                           class="form-control" value="100" min="0">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Initial Direction</label>
                    <select id="direction" class="form-select">
                        <option value="right">Right</option>
                        <option value="left">Left</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Request Distribution</label>
                    <select id="distribution" class="form-select">
                        <option value="uniform">Uniform</option>
                        <option value="locality">Locality-based</option>
                        <option value="sequential">Sequential Bursts</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Random Seed</label>
                    <input type="number" id="seed"
                           class="form-control" value="42">
                </div>

            </div>

            <button class="btn btn-primary mt-4 w-100"
                    id="runButton" onclick="runBenchmark()">
                Run Benchmark
            </button>

            <p id="error" class="text-danger mt-3 mb-0"></p>

        </div>
    </div>

    <div id="results" style="display:none;">

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4>Generated Workload</h4>
                <p id="workloadInfo" class="text-muted"></p>
                <div id="requestList" class="small"></div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4>Generated Workload Distribution</h4>
                <p id="workloadChartInfo" class="text-muted small"></p>
                <canvas id="workloadChart"></canvas>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4>Algorithm Metrics</h4>

                <div class="table-responsive">
                    <table class="table table-striped mt-3">
                        <thead id="metricsHead"></thead>
                        <tbody id="metricsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4>Total Head Movement Comparison</h4>
                <canvas id="movementChart"></canvas>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4>Head Movement Paths</h4>
                <p id="pathChartInfo" class="text-muted small"></p>
                <canvas id="pathChart"></canvas>
            </div>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
